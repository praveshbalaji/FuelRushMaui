<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="splashCyan" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00E5FF"/>
            <stop offset="100%" stop-color="#0088FF"/>
        </linearGradient>
        <linearGradient id="splashGold" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FFD700"/>
            <stop offset="100%" stop-color="#FF9900"/>
        </linearGradient>
    </defs>
    <!-- Background Shield -->
    <rect x="0" y="0" width="456" height="456" fill="#0A0E17"/>
    <g transform="translate(0, -10)">
        <!-- Steering Wheel Icon -->
        <circle cx="228" cy="180" r="80" fill="none" stroke="url(#splashCyan)" stroke-width="14"/>
        <path d="M 228 100 L 228 150" stroke="url(#splashCyan)" stroke-width="12" stroke-linecap="round"/>
        <path d="M 158 215 L 200 190" stroke="url(#splashCyan)" stroke-width="12" stroke-linecap="round"/>
        <path d="M 298 215 L 256 190" stroke="url(#splashCyan)" stroke-width="12" stroke-linecap="round"/>
        <circle cx="228" cy="180" r="32" fill="#0A0E17" stroke="url(#splashGold)" stroke-width="5"/>
        <text x="228" y="188" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="url(#splashGold)" text-anchor="middle">GT</text>

        <!-- Mustang Fuel Rush Title -->
        <text x="228" y="315" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="url(#splashCyan)" text-anchor="middle" letter-spacing="2">MUSTANG</text>
        <text x="228" y="355" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="url(#splashGold)" text-anchor="middle" letter-spacing="4">FUEL RUSH</text>
        <text x="228" y="388" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#94A3B8" text-anchor="middle" letter-spacing="3">TRUCK &amp; CAR SIMULATOR</text>
    </g>
