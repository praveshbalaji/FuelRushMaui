name: MAUI Build & Automated Multi-Platform Release (Android & iOS)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-android:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Android Workload
        run: |
          dotnet workload install maui-android

      - name: Generate Release Keystore for Signing
        run: |
          keytool -genkeypair -v \
            -keystore fuelrush.keystore \
            -alias fuelrushkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass Password123! \
            -keypass Password123! \
            -dname "CN=FuelRush, OU=Gaming, O=FuelRush, L=City, ST=State, C=US"

      - name: Build & Publish Signed Release APK
        run: |
          dotnet publish FuelRushMaui.csproj \
            -f net10.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=fuelrush.keystore \
            -p:AndroidSigningKeyAlias=fuelrushkey \
            -p:AndroidSigningKeyPass=Password123! \
            -p:AndroidSigningStorePass=Password123! \
            -p:EmbedAssembliesIntoApk=true \
            -o output/android

      - name: Prepare Release Binary
        run: |
          mkdir -p release_assets
          SIGNED_APK=$(find output/android -name "*-Signed.apk" -o -name "*.apk" | head -n 1)
          cp "$SIGNED_APK" release_assets/FuelRushMaui.apk
          cp "$SIGNED_APK" release_assets/fuelrush.apk

      - name: Publish & Overwrite Latest Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "Fuel Rush Mustang Simulator - Latest Release (Android & iOS)"
          body: |
            ## 🏎️ Fuel Rush Mustang Simulator - Production Release
            
            This automated release contains production-ready binaries for both **Android** (`FuelRushMaui.apk`) and **iOS / macOS**.
            
            ### 📱 Download & Installation
            - Android APK Download Link: `https://github.com/${{ github.repository }}/releases/download/latest/FuelRushMaui.apk`
            - Mirror Link: `https://github.com/${{ github.repository }}/releases/download/latest/fuelrush.apk`
            - Cryptographically signed with release keystore to eliminate Play Protect warnings.
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            release_assets/FuelRushMaui.apk
            release_assets/fuelrush.apk

  build-ios:
    name: Build iOS Bundle (.app / .ipa)
    runs-on: macos-14
    needs: build-and-release-android
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Xcode & Install .NET MAUI Workloads
        run: |
          echo "Current Xcode developer directory: $(xcode-select -p)"
          xcodebuild -version
          dotnet workload install maui maui-ios maui-android --source https://api.nuget.org/v3/index.json

      - name: Build & Package iOS App & IPA
        run: |
          mkdir -p release_assets Payload

          echo "=== 1. Building iOS Physical Device Target (ios-arm64) ==="
          dotnet publish FuelRushMaui.csproj \
            -f net10.0-ios \
            -c Debug \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:BuildIpa=true \
            -p:PublishTrimmed=false \
            -p:TrimMode=none \
            -p:MtouchLink=None \
            -p:UseInterpreter=true \
            -p:MtouchInterpreter=all \
            -p:MtouchUseLlvm=false \
            -p:MtouchFastDev=false \
            -p:Optimize=true \
            -p:ServerBuild=true \
            -p:ValidateXcodeVersion=false \
            -p:CodesignKey="-" \
            -p:CodesignProvision="" \
            -p:CodesignRequireProvisioningProfile=false > device_build.log 2>&1 || { echo "=== DEVICE BUILD ERROR LOG ==="; cat device_build.log; exit 1; }

          echo "=== 2. Building iOS Simulator Target (iossimulator-arm64) ==="
          dotnet build FuelRushMaui.csproj \
            -f net10.0-ios \
            -c Release \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:PublishTrimmed=false \
            -p:TrimMode=none \
            -p:MtouchLink=None \
            -p:ValidateXcodeVersion=false > sim_build.log 2>&1 || true

          echo "=== 3. Packaging Physical Device IPA for Sideloadly ==="
          DEVICE_IPA=$(find bin obj -name "*.ipa" -type f 2>/dev/null | head -n 1)
          if [ -n "$DEVICE_IPA" ]; then
            cp "$DEVICE_IPA" release_assets/FuelRushMaui.ipa
          else
            DEVICE_APP=$(find bin/Release/net10.0-ios/ios-arm64 bin obj -name "FuelRushMaui.app" -path "*ios-arm64*" -type d 2>/dev/null | head -n 1)
            if [ -z "$DEVICE_APP" ]; then
              DEVICE_APP=$(find bin obj -name "*.app" -not -path "*simulator*" -type d 2>/dev/null | head -n 1)
            fi

            echo "Found Physical Device App bundle at: $DEVICE_APP"
            if [ -n "$DEVICE_APP" ]; then
              rm -rf Payload
              mkdir -p Payload
              cp -R "$DEVICE_APP" Payload/
              zip -r release_assets/FuelRushMaui.ipa Payload
              rm -rf Payload
            fi
          fi

          SIM_APP=$(find bin obj -name "*.app" -path "*simulator*" -type d 2>/dev/null | head -n 1)
          if [ -n "$SIM_APP" ]; then
            zip -r release_assets/FuelRushMaui_iOS_Simulator.zip "$SIM_APP" || true
          fi

          echo "=== 4. Release Assets Directory Content ==="
          ls -la release_assets/

          if [ ! -f "release_assets/FuelRushMaui.ipa" ]; then
            echo "ERROR: FuelRushMaui.ipa for physical device was not created!"
            exit 1
          fi

      - name: Attach iOS Builds to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          make_latest: true
          overwrite: true
          fail_on_unmatched_files: false
          files: |
            release_assets/FuelRushMaui.ipa
            release_assets/FuelRushMaui_iOS_Simulator.zip

