name: MAUI Build & Automated Multi-Platform Release (Android & iOS)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-release-android:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Install .NET MAUI Android Workload
        run: |
          dotnet workload install maui-android

      - name: Generate Release Keystore for Signing
        run: |
          keytool -genkeypair -v \
            -keystore fuelrush.keystore \
            -alias fuelrushkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass Password123! \
            -keypass Password123! \
            -dname "CN=FuelRush, OU=Gaming, O=FuelRush, L=City, ST=State, C=US"

      - name: Build & Publish Signed Release APK
        run: |
          dotnet publish FuelRushMaui.csproj \
            -f net10.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=fuelrush.keystore \
            -p:AndroidSigningKeyAlias=fuelrushkey \
            -p:AndroidSigningKeyPass=Password123! \
            -p:AndroidSigningStorePass=Password123! \
            -p:EmbedAssembliesIntoApk=true \
            -o output/android

      - name: Prepare Release Binary
        run: |
          mkdir -p release_assets
          SIGNED_APK=$(find output/android -name "*-Signed.apk" -o -name "*.apk" | head -n 1)
          cp "$SIGNED_APK" release_assets/FuelRushMaui.apk
          cp "$SIGNED_APK" release_assets/fuelrush.apk

      - name: Publish & Overwrite Latest Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "Fuel Rush Mustang Simulator - Latest Release (Android & iOS)"
          body: |
            ## 🏎️ Fuel Rush Mustang Simulator - Production Release
            
            This automated release contains production-ready binaries for both **Android** (`FuelRushMaui.apk`) and **iOS / macOS**.
            
            ### 📱 Download & Installation
            - Android APK Download Link: `https://github.com/${{ github.repository }}/releases/download/latest/FuelRushMaui.apk`
            - Mirror Link: `https://github.com/${{ github.repository }}/releases/download/latest/fuelrush.apk`
            - Cryptographically signed with release keystore to eliminate Play Protect warnings.
          draft: false
          prerelease: false
          make_latest: true
          overwrite: true
          files: |
            release_assets/FuelRushMaui.apk
            release_assets/fuelrush.apk

  build-ios:
    name: Build iOS Bundle (.app / .ipa)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Install .NET MAUI iOS Workload
        run: |
          dotnet workload install maui-ios

      - name: Build & Package iOS IPA (for Sideloadly on Windows/Mac)
        run: |
          dotnet publish FuelRushMaui.csproj \
            -f net10.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:EnableCodeSigning=false \
            -o output/ios_device

          mkdir -p release_assets
          mkdir -p Payload
          APP_PATH=$(find output/ios_device bin/Release -name "*.app" -type d 2>/dev/null | head -n 1)
          echo "Found iOS App bundle at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r release_assets/FuelRushMaui.ipa Payload

      - name: Build iOS Simulator App Package
        run: |
          dotnet build FuelRushMaui.csproj \
            -f net10.0-ios \
            -c Release \
            -p:RuntimeIdentifier=iossimulator-x64 \
            -o output/ios_sim

          cd output/ios_sim
          zip -r ../../release_assets/FuelRushMaui_iOS_Simulator.zip .

      - name: Attach iOS Builds to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          files: |
            release_assets/FuelRushMaui.ipa
            release_assets/FuelRushMaui_iOS_Simulator.zip

