name: Build .NET MAUI Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          quality: 'preview'

      - name: Install .NET MAUI Android Workload
        run: |
          dotnet workload install maui-android

      - name: Build Android Standalone APK
        run: |
          dotnet build FuelRushMaui.csproj \
            -f net10.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk \
            -p:AndroidUseFastDeployment=false \
            -p:EmbedAssembliesIntoApk=true

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FuelRushMaui-Android-APK
          path: |
            **/bin/Release/net10.0-android/**/*.apk
