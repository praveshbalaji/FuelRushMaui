name: Build .NET MAUI iOS App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          quality: 'preview'

      - name: Install .NET MAUI Workloads
        run: |
          dotnet workload install maui-ios maui-android

      - name: Build iOS Application (Simulator App Bundle)
        run: |
          dotnet build FuelRushMaui.csproj \
            -f net10.0-ios \
            -c Release \
            -p:Platform=iPhoneSimulator \
            -p:RuntimeIdentifier=iossimulator-x64

      - name: Upload iOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FuelRushMaui-iOS-Simulator-App
          path: |
            **/bin/Release/net10.0-ios/iossimulator-x64/**/*.app
