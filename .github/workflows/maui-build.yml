name: MAUI Build & Automated Release (Android APK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-release-android:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          quality: 'preview'

      - name: Install .NET MAUI Android Workload
        run: |
          dotnet workload install maui-android

      - name: Build & Publish Android APK
        run: |
          dotnet publish FuelRushMaui.csproj \
            -f net10.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk \
            -p:AndroidUseFastDeployment=false \
            -p:EmbedAssembliesIntoApk=true \
            -o output/android

      - name: Get Release Tag Version
        id: version
        run: |
          echo "TAG_NAME=v1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "FuelRushMaui Release ${{ env.TAG_NAME }}"
          body: |
            ## 🏎️ FuelRushMaui Release ${{ env.TAG_NAME }}
            
            Automated production build for Android.
            
            ### 📱 Download Instructions
            - Download `FuelRushMaui.apk` below directly onto your Android device.
            - Tap to install.
            
            *Note: Because this app is self-published to showcase my full-stack .NET MAUI skills, Android will ask you to allow installation from 'Unknown Sources'. The APK is cryptographically signed and perfectly safe.*
          draft: false
          prerelease: false
          files: |
            output/android/*.apk
